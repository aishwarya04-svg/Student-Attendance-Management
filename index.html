<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 900px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        input {
            max-width: 90%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete-btn {
            background: #dc2626;
        }

        .edit-btn {
            background: #0f766e;
        }

        .report-btn {
            background: #15803d;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #2563eb;
            color: white;
        }

        .present {
            color: green;
            font-weight: bold;
        }

        .absent {
            color: red;
            font-weight: bold;
        }

        .not-marked {
            color: #777;
        }

        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Student Attendance Management System</h1>
    <p>Manage and track student attendance easily.</p>

    <input type="text" id="studentName"
           placeholder="Enter student name">

    <button onclick="addStudent()">Add Student</button>

    <h3>Attendance Summary</h3>
    <p>Total Students: <span id="total">0</span></p>
    <p>Present: <span id="present">0</span></p>
    <p>Absent: <span id="absent">0</span></p>
    <p>Attendance Rate: <span id="rate">0%</span></p>

    <button class="report-btn" onclick="generateReport()">
        Generate Attendance Report (CSV)
    </button>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Attendance</th>
                    <th>Attendance %</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>
</div>

<script>
    let students = [];

    function addStudent() {
        const input = document.getElementById("studentName");
        const name = input.value.trim();

        if (!name) {
            alert("Please enter student name.");
            return;
        }

        students.push({
            name: name,
            status: "Not Marked",
            presentCount: 0,
            totalSessions: 0
        });

        input.value = "";
        displayStudents();
    }

    function markAttendance(index, status) {
        const student = students[index];

        // Count a session only the first time attendance is marked.
        if (student.status === "Not Marked") {
            student.totalSessions++;
        }

        // Correct the current session if the status is changed.
        if (status === "Present" && student.status !== "Present") {
            student.presentCount++;
        } else if (status === "Absent" && student.status === "Present") {
            student.presentCount--;
        }

        student.status = status;
        displayStudents();
    }

    function editStudent(index) {
        const currentName = students[index].name;
        const newName = prompt("Edit student name:", currentName);

        if (newName === null) return;

        if (newName.trim() === "") {
            alert("Student name cannot be empty.");
            return;
        }

        students[index].name = newName.trim();
        displayStudents();
    }

    function deleteStudent(index) {
        if (confirm("Are you sure you want to delete this student?")) {
            students.splice(index, 1);
            displayStudents();
        }
    }

    function getPercentage(student) {
        if (student.totalSessions === 0) return 0;

        return (student.presentCount / student.totalSessions) * 100;
    }

    function displayStudents() {
        const list = document.getElementById("studentList");
        list.innerHTML = "";

        students.forEach((student, index) => {
            const row = document.createElement("tr");
            const percentage = getPercentage(student);

            const nameCell = document.createElement("td");
            nameCell.textContent = student.name;

            const statusCell = document.createElement("td");
            statusCell.textContent = student.status;
            statusCell.className =
                student.status === "Not Marked"
                    ? "not-marked"
                    : student.status.toLowerCase();

            const percentageCell = document.createElement("td");
            percentageCell.textContent = percentage.toFixed(1) + "%";

            const actionCell = document.createElement("td");

            const presentButton = document.createElement("button");
            presentButton.textContent = "Present";
            presentButton.onclick = () => markAttendance(index, "Present");

            const absentButton = document.createElement("button");
            absentButton.textContent = "Absent";
            absentButton.onclick = () => markAttendance(index, "Absent");

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";
            editButton.className = "edit-btn";
            editButton.onclick = () => editStudent(index);

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = () => deleteStudent(index);

            actionCell.append(
                presentButton, absentButton, editButton, deleteButton
            );

            row.append(
                nameCell, statusCell, percentageCell, actionCell
            );

            list.appendChild(row);
        });

        const total = students.length;
        const present = students.filter(
            student => student.status === "Present"
        ).length;
        const absent = students.filter(
            student => student.status === "Absent"
        ).length;

        document.getElementById("total").textContent = total;
        document.getElementById("present").textContent = present;
        document.getElementById("absent").textContent = absent;

        const marked = present + absent;
        const rate = marked === 0 ? 0 : (present / marked) * 100;

        document.getElementById("rate").textContent =
            rate.toFixed(1) + "%";
    }

    function generateReport() {
        if (students.length === 0) {
            alert("Please add students before generating a report.");
            return;
        }

        const rows = [
            ["Student Name", "Current Status", "Present Sessions",
             "Total Marked Sessions", "Attendance Percentage"]
        ];

        students.forEach(student => {
            rows.push([
                student.name,
                student.status,
                student.presentCount,
                student.totalSessions,
                getPercentage(student).toFixed(1) + "%"
            ]);
        });

        // Escape CSV values so names containing commas or quotes work.
        const csv = rows.map(row =>
            row.map(value =>
                '"' + String(value).replace(/"/g, '""') + '"'
            ).join(",")
        ).join("\r\n");

        const blob = new Blob(["\uFEFF" + csv], {
            type: "text/csv;charset=utf-8;"
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "student_attendance_report.csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
